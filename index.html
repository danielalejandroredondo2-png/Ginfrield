<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ginfrield</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080808;
            color: white;
            text-align: center;
        }

        header {
            padding: 80px 20px;
            background: linear-gradient(135deg, #111, #292929);
        }

        h1 {
            font-size: 70px;
            margin: 0;
            letter-spacing: 5px;
        }

        .subtitle {
            font-size: 22px;
            color: #aaa;
            margin: 15px 0 35px;
        }

        .download {
            display: inline-block;
            padding: 18px 40px;
            background: white;
            color: black;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.2s;
        }

        .download:hover {
            transform: scale(1.05);
            background: #ddd;
        }

        section {
            padding: 60px 20px;
        }

        .card {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            background: #151515;
            border-radius: 15px;
            border: 1px solid #333;
        }

        h2 {
            font-size: 35px;
        }

        footer {
            padding: 30px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>GINFRIELD</h1>

        <p class="subtitle">
            El comienzo de una nueva aventura.
        </p>

        <a class="download" href="#">
            DESCARGAR GINFRIELD
        </a>
    </header>

    <section>
        <div class="card">
            <h2>🎮 Ginfrield</h2>

            <p>
                Bienvenido al sitio oficial de Ginfrield.
                Aquí podrás descargar el juego y recibir
                futuras actualizaciones.
            </p>
        </div>
    </section>

    <section>
        <div class="card">
            <h2>🚀 Próximamente</h2>

            <p>
                Nuevos niveles, enemigos, mapas y muchas
                más cosas llegarán próximamente.
            </p>
        </div>
    </section>

    <footer>
        Ginfrield © 2026
    </footer>

</body>
</html>
